server {
    listen 80;
    listen [::]:80;
    server_name coolreader.nimbushub.eu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://pocketbook.nimbushub.eu$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coolreader.nimbushub.eu;
    ssl_certificate /etc/letsencrypt/live/coolreader.nimbushub.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolreader.nimbushub.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://pocketbook.nimbushub.eu$request_uri;
}
