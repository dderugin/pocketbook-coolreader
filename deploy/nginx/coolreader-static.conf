index index.html;
autoindex off;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control "no-cache";

location / {
    try_files $uri $uri/ =404;
}

location /downloads/ {
    try_files $uri =404;
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}

location ~ /\. {
    deny all;
}
